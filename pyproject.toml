[project]
name = "cryptobot"
version = "1.0.0"
description = "A custodial multi-currency wallet with a P2P escrow marketplace for Telegram (educational/simulated ledger)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "robotic0" }]
keywords = ["telegram", "bot", "aiogram", "crypto", "p2p", "escrow", "wallet"]

dependencies = [
    "aiogram>=3.13,<4.0",
    "SQLAlchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20",
    "aiohttp>=3.9",
    "environs>=11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
cryptobot = "bot:main"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
